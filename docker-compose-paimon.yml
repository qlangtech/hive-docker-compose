version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    volumes:
      - namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop-hive.env
    ports:
      - "50070:50070"
      - "8020:8020"
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    volumes:
      - datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    ports:
      - "50075:50075"
      - "50010:50010"
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    env_file:
      - ./hadoop-hive.env
    depends_on:
      - minio
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      HIVE_AUX_JARS_PATH: "/opt/hive/lib/paimon-hive-connector-2.3-1.1.1.jar:/opt/hive/lib/hadoop-aws-2.7.4.jar:/opt/hive/lib/aws-java-sdk-1.7.4.jar"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    volumes:
      - ./paimon-hive-connector-2.3-1.1.1.jar:/opt/hive/lib/paimon-hive-connector-2.3-1.1.1.jar
      - ./hadoop-aws-2.7.4.jar:/opt/hive/lib/hadoop-aws-2.7.4.jar
      - ./aws-java-sdk-1.7.4.jar:/opt/hive/lib/aws-java-sdk-1.7.4.jar
    ports:
      - "10000:10000"
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    env_file:
      - ./hadoop-hive.env
    depends_on:
      - minio
    command: /opt/hive/bin/hive --service metastore
    environment:
      HIVE_AUX_JARS_PATH: "/opt/hive/lib/paimon-hive-connector-2.3-1.1.1.jar:/opt/hive/lib/hadoop-aws-2.7.4.jar:/opt/hive/lib/aws-java-sdk-1.7.4.jar"
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    volumes:
      - ./paimon-hive-connector-2.3-1.1.1.jar:/opt/hive/lib/paimon-hive-connector-2.3-1.1.1.jar
      - ./hadoop-aws-2.7.4.jar:/opt/hive/lib/hadoop-aws-2.7.4.jar
      - ./aws-java-sdk-1.7.4.jar:/opt/hive/lib/aws-java-sdk-1.7.4.jar
    ports:
      - "9083:9083"
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: baisui
      MINIO_ROOT_PASSWORD: "12345678"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  presto-coordinator:
    image: shawnzhu/prestodb:0.181
    ports:
      - "8080:8080"
      - "5432:5432"

volumes:
  namenode:
  datanode:
  minio_data:
